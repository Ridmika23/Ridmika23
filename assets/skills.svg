    <rect x="596" y="364" width="78" height="28" rx="14" fill="#0D1526" stroke="#1E3FB2" stroke-width="1"/><text class="sans" x="635" y="382" font-size="12.5" fill="#C8DEFF" text-anchor="middle">Node.js</text>
    <rect x="440" y="402" width="98" height="28" rx="14" fill="#0D1526" stroke="#1E3FB2" stroke-width="1"/><text class="sans" x="489" y="420" font-size="12.5" fill="#C8DEFF" text-anchor="middle">Express.js</text>
    <rect x="546" y="402" width="62" height="28" rx="14" fill="#0D1526" stroke="#1E3FB2" stroke-width="1"/><text class="sans" x="577" y="420" font-size="12.5" fill="#C8DEFF" text-anchor="middle">HTML5</text>
    <rect x="616" y="402" width="55" height="28" rx="14" fill="#0D1526" stroke="#1E3FB2" stroke-width="1"/><text class="sans" x="644" y="420" font-size="12.5" fill="#C8DEFF" text-anchor="middle">CSS3</text>
