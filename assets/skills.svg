<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="578" viewBox="0 0 1200 578" role="img" aria-label="Toolkit: BI and data, languages, QA tools, testing practice, web and mobile, tools">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
    <linearGradient id="nameGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#2875FB"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="chipGrad1" x1="0" x2="1">
      <stop offset="0" stop-color="#1E3FB2"/>
      <stop offset="1" stop-color="#2875FB"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2875FB" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#2875FB" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="panelClip"><rect x="10" y="10" width="1180" height="558" rx="22"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Consolas, Menlo, monospace; }
    .pulse { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
    .frame { stroke-dasharray: 3800; stroke-dashoffset: 3800; animation: draw 1.8s .2s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .card { opacity: 0; animation: cardIn .5s cubic-bezier(.2,.7,.2,1) forwards; }
    .c1{animation-delay:.10s;} .c2{animation-delay:.22s;} .c3{animation-delay:.34s;}
    .c4{animation-delay:.46s;} .c5{animation-delay:.58s;} .c6{animation-delay:.70s;}
    @keyframes cardIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  </style>

  <rect x="10" y="10" width="1180" height="558" rx="22" fill="#080D18"/>
  <rect x="10" y="10" width="1180" height="558" fill="url(#dots)" clip-path="url(#panelClip)"/>

  <!-- Radial glows -->
  <ellipse cx="200"  cy="300" rx="320" ry="300" fill="url(#glowA)" opacity="0.8"/>
  <ellipse cx="1000" cy="300" rx="280" ry="260" fill="url(#glowA)" opacity="0.7"/>

  <!-- Draw border -->
  <rect class="frame" x="11" y="11" width="1178" height="556" rx="21" fill="none" stroke="url(#nameGrad)" stroke-width="1.4" opacity="0.6"/>

  <!-- Header -->
  <text class="mono" x="50" y="60" font-size="11.5" fill="#2875FB" letter-spacing="4">// 02 — TOOLKIT</text>
  <text class="sans" x="50" y="98" font-size="28" font-weight="800" fill="#E8F0FF" letter-spacing="-.4">What I work with</text>
  <rect x="982" y="42" width="168" height="26" rx="13" fill="#0D1526" stroke="#1E3FB2" stroke-width="1"/>
  <circle class="pulse" cx="1000" cy="55" r="3" fill="#2875FB"/>
  <text class="mono" x="1010" y="59" font-size="10.5" fill="#60A5FA">39 tools &amp; skills</text>

  <!-- Card 1: BI & DATA -->
  <g class="card c1">
    <rect x="50" y="122" width="356" height="176" rx="14" fill="#060B15" stroke="#1E3FB2" stroke-width="1.2"/>
