    <rect x="68" y="402" width="128" height="28" rx="14" fill="#0D1526" stroke="#1E3FB2" stroke-width="1"/><text class="sans" x="132" y="420" font-size="12.5" fill="#C8DEFF" text-anchor="middle">Smoke &amp; Sanity</text>
