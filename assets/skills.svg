    <rect x="68" y="172" width="85" height="28" rx="14" fill="url(#chipGrad1)" fill-opacity="0.8"/>
    <text class="sans" x="110" y="190" font-size="12.5" fill="#fff" text-anchor="middle">Power BI</text>
    <rect x="161" y="172" width="62" height="28" rx="14" fill="#0D1526" stroke="#2875FB" stroke-width="1"/>
    <text class="sans" x="192" y="190" font-size="12.5" fill="#C8DEFF" text-anchor="middle">Excel</text>
