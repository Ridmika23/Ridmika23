    <rect x="609" y="248" width="33" height="28" rx="14" fill="#0D1526" stroke="#1E3FB2" stroke-width="1"/><text class="sans" x="626" y="266" font-size="12.5" fill="#C8DEFF" text-anchor="middle">C</text>
