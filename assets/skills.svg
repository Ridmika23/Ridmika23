    <rect x="68" y="440" width="143" height="28" rx="14" fill="#0D1526" stroke="#1E3FB2" stroke-width="1"/><text class="sans" x="139" y="458" font-size="12.5" fill="#C8DEFF" text-anchor="middle">Test Case Design</text>
    <rect x="219" y="440" width="98" height="28" rx="14" fill="#0D1526" stroke="#1E3FB2" stroke-width="1"/><text class="sans" x="268" y="458" font-size="12.5" fill="#C8DEFF" text-anchor="middle">Test Plans</text>
