    <rect x="518" y="172" width="70" height="28" rx="14" fill="#0D1526" stroke="#2875FB" stroke-width="1"/><text class="sans" x="553" y="190" font-size="12.5" fill="#C8DEFF" text-anchor="middle">Pandas</text>
    <rect x="596" y="172" width="62" height="28" rx="14" fill="#0D1526" stroke="#1E3FB2" stroke-width="1"/><text class="sans" x="627" y="190" font-size="12.5" fill="#C8DEFF" text-anchor="middle">NumPy</text>
    <rect x="440" y="210" width="114" height="28" rx="14" fill="#0D1526" stroke="#1E3FB2" stroke-width="1"/><text class="sans" x="497" y="228" font-size="12.5" fill="#C8DEFF" text-anchor="middle">Scikit-learn</text>
    <rect x="562" y="210" width="78" height="28" rx="14" fill="#0D1526" stroke="#1E3FB2" stroke-width="1"/><text class="sans" x="601" y="228" font-size="12.5" fill="#C8DEFF" text-anchor="middle">PyTorch</text>
    <rect x="648" y="210" width="70" height="28" rx="14" fill="#0D1526" stroke="#1E3FB2" stroke-width="1"/><text class="sans" x="683" y="228" font-size="12.5" fill="#C8DEFF" text-anchor="middle">Plotly</text>
    <rect x="440" y="248" width="55" height="28" rx="14" fill="#0D1526" stroke="#1E3FB2" stroke-width="1"/><text class="sans" x="468" y="266" font-size="12.5" fill="#C8DEFF" text-anchor="middle">Java</text>
