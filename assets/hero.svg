<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Ridmika Yohani Ekanayaka — Data Analytics and Quality Assurance">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
    <linearGradient id="nameGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2875FB"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#1E3FB2"/>
      <stop offset="1" stop-color="#2875FB"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2875FB" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2875FB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#93C5FD"/>
      <stop offset="0.45" stop-color="#2875FB"/>
      <stop offset="1" stop-color="#0D1526"/>
    </radialGradient>
    <clipPath id="panelClip"><rect x="10" y="10" width="1180" height="420" rx="22"/></clipPath>
    <clipPath id="tagClip">
      <rect x="718" y="360" width="0" height="44">
        <animate attributeName="width" values="0;230;230;0" keyTimes="0;0.35;0.9;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Consolas, Menlo, monospace; }

    .pulse { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }

    .frame { stroke-dasharray: 3200; stroke-dashoffset: 3200; animation: draw 1.6s .2s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .handle { opacity: 0; animation: pop .35s forwards; transform-box: fill-box; transform-origin: center; }
    .h1 { animation-delay: 1.6s; } .h2 { animation-delay: 1.75s; } .h3 { animation-delay: 1.9s; } .h4 { animation-delay: 2.05s; }
    .dim { opacity: 0; animation: fade .5s 2.1s forwards; }
    @keyframes pop { 0% { opacity: 0; transform: scale(0); } 70% { transform: scale(1.35); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes fade { to { opacity: 1; } }

    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    .r1 { animation-delay: .1s; } .r2 { animation-delay: .3s; } .r3 { animation-delay: .5s; }
    .r4 { animation-delay: .85s; } .r5 { animation-delay: 1.05s; } .r6 { animation-delay: 1.25s; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

    .cursor { animation: cursor 9s cubic-bezier(.65,0,.35,1) infinite; }
    @keyframes cursor {
      0%   { transform: translate(1080px, 430px); opacity: 0; }
      8%   { opacity: 1; }
      22%  { transform: translate(520px, 290px); }
      30%  { transform: translate(520px, 290px); }
      40%  { transform: translate(545px, 308px); }
      48%  { transform: translate(520px, 290px); }
      62%  { transform: translate(520px, 290px); }
      80%  { transform: translate(760px, 390px); opacity: 1; }
      92%  { transform: translate(1080px, 430px); opacity: 0; }
      100% { transform: translate(1080px, 430px); opacity: 0; }
    }

    .orb { animation: orbanim 3.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes orbanim { 0%,100% { transform: scale(1); } 50% { transform: scale(1.14); } }

    .float1 { animation: float 6s ease-in-out infinite; }
    .float2 { animation: float 6s 1.5s ease-in-out infinite; }
    .float3 { animation: float 6s 3s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

    .role { opacity: 0; animation: role 9s infinite; }
    .t1 { animation-delay: 0s; } .t2 { animation-delay: 3s; } .t3 { animation-delay: 6s; }
    @keyframes role { 0% { opacity: 0; transform: translateY(6px); } 4%,30% { opacity: 1; transform: translateY(0); } 34%,100% { opacity: 0; transform: translateY(-6px); } }

    .bar { transform-box: fill-box; transform-origin: bottom; animation: bar 3s ease-in-out infinite; }
    @keyframes bar { 0%,100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }

    .m-bounce { animation: mbounce 2.4s cubic-bezier(.45,0,.55,1) infinite; }
    @keyframes mbounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    .m-squash { transform-box: fill-box; transform-origin: 50% 100%; animation: msquash 2.4s cubic-bezier(.45,0,.55,1) infinite; }
    @keyframes msquash { 0%,100% { transform: scale(1.06,.94); } 12% { transform: scale(1,1); } 50% { transform: scale(.97,1.03); } 88% { transform: scale(1,1); } }
    .m-eye { transform-box: fill-box; transform-origin: center; animation: mblink 4.5s infinite; }
    @keyframes mblink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    .m-wave { transform-box: fill-box; transform-origin: 30% 80%; animation: mwave 3s ease-in-out infinite; }
    @keyframes mwave { 0%,55%,100% { transform: rotate(0deg); } 62% { transform: rotate(-40deg); } 70% { transform: rotate(-15deg); } 78% { transform: rotate(-40deg); } 86% { transform: rotate(0deg); } }
    .m-shadow { transform-box: fill-box; transform-origin: center; animation: mshadow 2.4s cubic-bezier(.45,0,.55,1) infinite; }
    @keyframes mshadow { 0%,100% { transform: scale(1); opacity: .5; } 50% { transform: scale(.75); opacity: .2; } }
  </style>

  <!-- Panel bg -->
  <rect x="10" y="10" width="1180" height="420" rx="22" fill="#080D18"/>
  <rect x="10" y="10" width="1180" height="420" fill="url(#dots)" clip-path="url(#panelClip)"/>

  <!-- Radial glow orbs -->
  <ellipse cx="160" cy="220" rx="300" ry="280" fill="url(#glowA)"/>
  <ellipse cx="1060" cy="100" rx="260" ry="240" fill="url(#glowB)"/>
  <ellipse cx="700" cy="440" rx="220" ry="160" fill="url(#glowA)" opacity="0.6"/>

  <!-- Animated draw border -->
  <rect class="frame" x="11" y="11" width="1178" height="418" rx="21" fill="none" stroke="url(#nameGrad)" stroke-width="1.5" opacity="0.7"/>

  <!-- Tab bar -->
  <rect class="rise r1" x="40" y="34" width="200" height="26" rx="13" fill="#0D1526" stroke="#1E3FB2" stroke-width="1"/>
  <circle class="pulse rise r1" cx="58" cy="47" r="3" fill="#2875FB"/>
  <text class="mono rise r1" x="68" y="51" font-size="10.5" fill="#60A5FA" letter-spacing="0.5">ridmika23 / README.md</text>
  <text class="mono rise r1" x="1158" y="51" font-size="10" fill="#3B5498" text-anchor="end" letter-spacing="1">RATNAPURA, LK · OPEN TO INTERNSHIPS</text>

  <!-- Floating orb (right side) -->
  <g class="float1">
    <circle class="orb" cx="950" cy="220" r="88" fill="url(#orb)" opacity="0.9"/>
    <circle cx="950" cy="220" r="88" fill="none" stroke="#2875FB" stroke-width="1" opacity="0.4"/>
    <circle cx="950" cy="220" r="104" fill="none" stroke="#1E3FB2" stroke-width="0.6" stroke-dasharray="6 4" opacity="0.35"/>
  </g>
  <!-- Orb inner glow ring -->
  <circle class="float2" cx="950" cy="220" r="66" fill="none" stroke="#60A5FA" stroke-width="0.8" opacity="0.3"/>

  <!-- Left text content -->
  <text class="mono rise r2" x="52" y="130" font-size="11.5" fill="#2875FB" letter-spacing="4">// DATA ANALYTICS · QUALITY ASSURANCE</text>
  <text class="sans rise r2" x="50" y="166" font-size="20" font-weight="600" fill="#3B5498">Hi, I'm</text>

  <g class="rise r3">
    <text class="sans" x="48" y="222" font-size="54" font-weight="800" fill="#E8F0FF" letter-spacing="-1.5">Ridmika Yohani</text>
    <text class="sans" x="48" y="280" font-size="54" font-weight="800" fill="url(#nameGrad)" letter-spacing="-1.5">Ekanayaka</text>
  </g>
  <text class="sans rise r4" x="52" y="326" font-size="16.5" fill="#5B78B8">I find the story in the data, and the bugs before your users do.</text>

  <!-- Animated role terminal pill -->
  <g class="rise r5">
    <rect x="50" y="350" width="430" height="34" rx="17" fill="#0D1526" stroke="url(#tagGrad)" stroke-width="1.2"/>
    <text class="mono" x="70" y="372" font-size="12" fill="#2875FB">▸</text>
    <text class="mono role t1" x="88" y="372" font-size="11.5" fill="#C8DEFF">Final-year Software Engineering @ SLTC</text>
    <text class="mono role t2" x="88" y="372" font-size="11.5" fill="#C8DEFF">Power BI · Python · Pytest · Selenium</text>
    <text class="mono role t3" x="88" y="372" font-size="11.5" fill="#C8DEFF">IEEE CS SLTC · Treasurer 2025–26</text>
  </g>

  <!-- Skill handle badges (pop in) -->
  <g class="handle h1">
    <rect x="52" y="394" width="90" height="22" rx="11" fill="url(#tagGrad)"/>
    <text class="sans" x="97" y="409" font-size="11" fill="#fff" text-anchor="middle" font-weight="600">Data Analytics</text>
  </g>
  <g class="handle h2">
    <rect x="150" y="394" width="62" height="22" rx="11" fill="#0D1526" stroke="#2875FB" stroke-width="1"/>
    <text class="sans" x="181" y="409" font-size="11" fill="#60A5FA" text-anchor="middle">QA · Testing</text>
  </g>
  <g class="handle h3">
    <rect x="220" y="394" width="56" height="22" rx="11" fill="#0D1526" stroke="#1E3FB2" stroke-width="1"/>
    <text class="sans" x="248" y="409" font-size="11" fill="#60A5FA" text-anchor="middle">Power BI</text>
  </g>
  <g class="handle h4">
    <rect x="284" y="394" width="56" height="22" rx="11" fill="#0D1526" stroke="#1E3FB2" stroke-width="1"/>
    <text class="sans" x="312" y="409" font-size="11" fill="#60A5FA" text-anchor="middle">Python</text>
  </g>

  <!-- Floating data card -->
  <g class="float2">
    <rect x="700" y="168" width="148" height="86" rx="14" fill="#0D1526" stroke="#1E3FB2" stroke-width="1.2"/>
    <rect x="700" y="168" width="148" height="86" rx="14" fill="#2875FB" fill-opacity="0.04"/>
    <text class="mono" x="716" y="192" font-size="9.5" fill="#5B78B8">▤ prices.pbix</text>
    <rect class="bar" x="718" y="214" width="12" height="22" rx="2" fill="#1E3FB2"/>
    <rect class="bar" style="animation-delay:.18s" x="736" y="206" width="12" height="30" rx="2" fill="#2875FB" opacity="0.8"/>
    <rect class="bar" style="animation-delay:.36s" x="754" y="210" width="12" height="26" rx="2" fill="#1E3FB2"/>
    <rect class="bar" style="animation-delay:.54s" x="772" y="200" width="12" height="36" rx="2" fill="#2875FB"/>
    <rect class="bar" style="animation-delay:.72s" x="790" y="205" width="12" height="31" rx="2" fill="#60A5FA"/>
    <rect class="bar" style="animation-delay:.90s" x="808" y="197" width="12" height="39" rx="2" fill="#2875FB"/>
  </g>

  <!-- "all tests passed" chip -->
  <g class="float3">
    <rect x="1016" y="272" width="148" height="32" rx="16" fill="#0D1526" stroke="#2875FB" stroke-width="1.2"/>
    <circle cx="1034" cy="288" r="7.5" fill="#2875FB"/>
    <path d="M1030.5 288 l2.5 2.5 l4.5 -5.5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="mono" x="1048" y="293" font-size="11" fill="#C8DEFF">all tests passed</text>
  </g>

  <!-- Speech bubble -->
  <g class="dim">
    <rect x="960" y="120" width="196" height="46" rx="14" fill="#0D1526" stroke="#1E3FB2" stroke-width="1.2"/>
    <path d="M982 164 L966 184 L1000 165 Z" fill="#0D1526" stroke="#1E3FB2" stroke-width="1.2" stroke-linejoin="round"/>
    <rect x="978" y="161" width="28" height="6" fill="#0D1526"/>
    <text class="sans role t1" x="1058" y="148" font-size="13" font-weight="600" fill="#E8F0FF" text-anchor="middle">Found a bug!</text>
    <text class="sans role t2" x="1058" y="148" font-size="13" font-weight="600" fill="#E8F0FF" text-anchor="middle">All tests passed ✓</text>
    <text class="sans role t3" x="1058" y="148" font-size="13" font-weight="600" fill="#E8F0FF" text-anchor="middle">Let me chart that.</text>
  </g>

  <!-- Animated cursor -->
  <g class="cursor">
    <path d="M0 0 L0 16 L4.5 12 L7.5 18 L10 17 L7 11 L12 11 Z" fill="#60A5FA" stroke="#0D1526" stroke-width="0.8"/>
  </g>

  <!-- Character mascot -->
  <g transform="translate(890 290) scale(1.55)">
    <ellipse class="m-shadow" cx="0" cy="62" rx="44" ry="7" fill="#1E3FB2" fill-opacity="0.35"/>
    <g class="m-bounce"><g class="m-squash">
      <ellipse cx="-16" cy="56" rx="11" ry="7" fill="#0D1526" stroke="#1E3FB2" stroke-width="2"/>
      <ellipse cx="16" cy="56" rx="11" ry="7" fill="#0D1526" stroke="#1E3FB2" stroke-width="2"/>
      <ellipse cx="-56" cy="14" rx="9" ry="13" fill="#0D1526" stroke="#1E3FB2" stroke-width="2"/>
      <ellipse class="m-wave" cx="56" cy="12" rx="9" ry="13" fill="#0D1526" stroke="#1E3FB2" stroke-width="2"/>
      <path d="M-54 50 C-60 -8 -48 -48 0 -48 C48 -48 60 -8 54 50 Q0 60 -54 50 Z" fill="#0D1526" stroke="#1E3FB2" stroke-width="2.2"/>
      <path d="M36 -34 Q58 0 48 46 Q36 54 22 56 Q46 20 36 -34 Z" fill="#2875FB" fill-opacity="0.18"/>
      <circle cx="-30" cy="-30" r="1.4" fill="#2563EB" fill-opacity="0.8"/><circle cx="-18" cy="-40" r="1.4" fill="#2563EB" fill-opacity="0.8"/><circle cx="22" cy="-36" r="1.4" fill="#2563EB" fill-opacity="0.8"/><circle cx="34" cy="-18" r="1.4" fill="#2563EB" fill-opacity="0.8"/><circle cx="-38" cy="20" r="1.4" fill="#2563EB" fill-opacity="0.8"/><circle cx="36" cy="30" r="1.4" fill="#2563EB" fill-opacity="0.8"/><circle cx="-24" cy="40" r="1.4" fill="#2563EB" fill-opacity="0.8"/>
      <ellipse class="m-eye" cx="-13" cy="-4" rx="4" ry="5" fill="#60A5FA"/>
      <ellipse class="m-eye" cx="13" cy="-4" rx="4" ry="5" fill="#60A5FA"/>
      <circle cx="-11.5" cy="-6" r="1.3" fill="#ffffff"/><circle cx="14.5" cy="-6" r="1.3" fill="#ffffff"/>
      <ellipse cx="-25" cy="8" rx="7" ry="4" fill="#ff9fb4" fill-opacity="0.55"/>
      <ellipse cx="25" cy="8" rx="7" ry="4" fill="#ff9fb4" fill-opacity="0.55"/>
      <path d="M-7 7 Q0 14 7 7" fill="none" stroke="#E8F0FF" stroke-width="2.2" stroke-linecap="round"/>
    </g></g>
  </g>
</svg>
