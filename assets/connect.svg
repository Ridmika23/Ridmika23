<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Got data to explore or a build to test? Let's connect.">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
    <linearGradient id="nameGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#2875FB"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2875FB" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#2875FB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="panelClip"><rect x="10" y="10" width="1180" height="280" rx="22"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Consolas, Menlo, monospace; }

    .frame { stroke-dasharray: 2800; stroke-dashoffset: 2800; animation: draw 1.6s .2s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .heart { opacity: 0; animation: heart 4s ease-out infinite; }
    @keyframes heart { 0% { opacity: 0; transform: translateY(0) scale(.6); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-60px) scale(1); } }

    .m-bounce { animation: mbounce 2.4s cubic-bezier(.45,0,.55,1) infinite; }
    @keyframes mbounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    .m-squash { transform-box: fill-box; transform-origin: 50% 100%; animation: msquash 2.4s cubic-bezier(.45,0,.55,1) infinite; }
    @keyframes msquash { 0%,100% { transform: scale(1.06,.94); } 12% { transform: scale(1,1); } 50% { transform: scale(.97,1.03); } 88% { transform: scale(1,1); } }
    .m-eye { transform-box: fill-box; transform-origin: center; animation: mblink 4.5s infinite; }
    @keyframes mblink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    .m-wave { transform-box: fill-box; transform-origin: 30% 80%; animation: mwave 3s ease-in-out infinite; }
    @keyframes mwave { 0%,55%,100% { transform: rotate(0deg); } 62% { transform: rotate(-40deg); } 70% { transform: rotate(-15deg); } 78% { transform: rotate(-40deg); } 86% { transform: rotate(0deg); } }
    .m-shadow { transform-box: fill-box; transform-origin: center; animation: mshadow 2.4s cubic-bezier(.45,0,.55,1) infinite; }
    @keyframes mshadow { 0%,100% { transform: scale(1); opacity: .4; } 50% { transform: scale(.75); opacity: .15; } }

    .pulse { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
  </style>

  <rect x="10" y="10" width="1180" height="280" rx="22" fill="#080D18"/>
  <rect x="10" y="10" width="1180" height="280" fill="url(#dots)" clip-path="url(#panelClip)"/>

  <!-- Radial glows -->
  <ellipse cx="900" cy="150" rx="350" ry="260" fill="url(#glowA)"/>
  <ellipse cx="250" cy="280" rx="260" ry="200" fill="url(#glowB)"/>

  <!-- Draw border -->
  <rect class="frame" x="11" y="11" width="1178" height="278" rx="21" fill="none" stroke="url(#nameGrad)" stroke-width="1.4" opacity="0.65"/>

  <!-- Mascot -->
  <g transform="translate(235 190) scale(1.25)">
    <ellipse class="m-shadow" cx="0" cy="62" rx="44" ry="7" fill="#1E3FB2" fill-opacity="0.35"/>
    <g class="m-bounce"><g class="m-squash">
      <ellipse cx="-16" cy="56" rx="11" ry="7" fill="#0D1526" stroke="#1E3FB2" stroke-width="2"/>
      <ellipse cx="16" cy="56" rx="11" ry="7" fill="#0D1526" stroke="#1E3FB2" stroke-width="2"/>
      <ellipse cx="-56" cy="14" rx="9" ry="13" fill="#0D1526" stroke="#1E3FB2" stroke-width="2"/>
      <ellipse class="m-wave" cx="56" cy="12" rx="9" ry="13" fill="#0D1526" stroke="#1E3FB2" stroke-width="2"/>
      <path d="M-54 50 C-60 -8 -48 -48 0 -48 C48 -48 60 -8 54 50 Q0 60 -54 50 Z" fill="#0D1526" stroke="#1E3FB2" stroke-width="2.2"/>
      <path d="M36 -34 Q58 0 48 46 Q36 54 22 56 Q46 20 36 -34 Z" fill="#2875FB" fill-opacity="0.18"/>
      <circle cx="-30" cy="-30" r="1.4" fill="#2563EB" fill-opacity="0.8"/><circle cx="-18" cy="-40" r="1.4" fill="#2563EB" fill-opacity="0.8"/><circle cx="22" cy="-36" r="1.4" fill="#2563EB" fill-opacity="0.8"/>
      <ellipse class="m-eye" cx="-13" cy="-4" rx="4" ry="5" fill="#60A5FA"/>
      <ellipse class="m-eye" cx="13" cy="-4" rx="4" ry="5" fill="#60A5FA"/>
      <circle cx="-11.5" cy="-6" r="1.3" fill="#ffffff"/><circle cx="14.5" cy="-6" r="1.3" fill="#ffffff"/>
      <ellipse cx="-25" cy="8" rx="7" ry="4" fill="#ff9fb4" fill-opacity="0.5"/>
      <ellipse cx="25" cy="8" rx="7" ry="4" fill="#ff9fb4" fill-opacity="0.5"/>
      <path d="M-7 7 Q0 14 7 7" fill="none" stroke="#E8F0FF" stroke-width="2.2" stroke-linecap="round"/>
    </g></g>
  </g>

  <!-- Floating hearts in blue tones -->
  <path class="heart" style="animation-delay:0s"   d="M305 118 l-7 -7 a4.5 4.5 0 0 1 7 -5.5 a4.5 4.5 0 0 1 7 5.5 Z" fill="#2875FB"/>
  <path class="heart" style="animation-delay:1.3s" d="M188 110 l-7 -7 a4.5 4.5 0 0 1 7 -5.5 a4.5 4.5 0 0 1 7 5.5 Z" fill="#60A5FA"/>
  <path class="heart" style="animation-delay:2.6s" d="M330 148 l-7 -7 a4.5 4.5 0 0 1 7 -5.5 a4.5 4.5 0 0 1 7 5.5 Z" fill="#1E3FB2"/>

  <!-- Text -->
  <text class="mono" x="498" y="88" font-size="11.5" fill="#2875FB" letter-spacing="4">// 05 — LET'S CONNECT</text>
  <text class="sans" x="496" y="148" font-size="38" font-weight="800" fill="#E8F0FF" letter-spacing="-1">Got data to explore</text>
  <text class="sans" x="496" y="196" font-size="38" font-weight="800" fill="url(#nameGrad)" letter-spacing="-1">or a build to test?</text>
  <text class="mono" x="498" y="236" font-size="12.5" fill="#3B5498">ekanayakaridmika2002@gmail.com  ·  Ratnapura, Sri Lanka</text>

  <!-- Pulsing availability dot -->
  <circle class="pulse" cx="480" cy="232" r="4" fill="#2875FB"/>
</svg>
