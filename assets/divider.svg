<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="28" viewBox="0 0 1200 28" role="img" aria-label="divider">
  <defs>
    <linearGradient id="beam" x1="0" x2="1">
      <stop offset="0"   stop-color="#2875FB" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#60A5FA"/>
      <stop offset="1"   stop-color="#1E3FB2" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="track"><rect x="40" y="11" width="1120" height="6"/></clipPath>
  </defs>
  <style>
    .beam { animation: sweep 2.4s linear infinite; }
    @keyframes sweep {
      0%   { transform: translateX(-1200px); }
      100% { transform: translateX(1200px); }
    }
    .dot { animation: dotpulse 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .d1 { animation-delay: 0s; } .d2 { animation-delay: 0.3s; } .d3 { animation-delay: 0.6s; }
    @keyframes dotpulse { 0%,100%{ transform:translateY(0); opacity:.5; } 50%{ transform:translateY(-4px); opacity:1; } }
  </style>
  <!-- base track -->
  <line x1="40" y1="14" x2="1160" y2="14" stroke="#1E3FB2" stroke-width="1" stroke-opacity="0.4"/>
  <!-- animated beam sweep -->
  <g clip-path="url(#track)">
    <rect class="beam" x="40" y="11" width="400" height="6" fill="url(#beam)" rx="3"/>
  </g>
  <!-- center dots -->
  <circle class="dot d1" cx="588" cy="14" r="4" fill="#1E3FB2"/>
  <circle class="dot d2" cx="600" cy="14" r="4.5" fill="#2875FB"/>
  <circle class="dot d3" cx="612" cy="14" r="4" fill="#60A5FA"/>
</svg>
