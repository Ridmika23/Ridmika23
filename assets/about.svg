    <circle cx="80" cy="226" r="9" fill="#2875FB"/>
    <path d="M75.5 226 l3 3 l5 -6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="mono" x="100" y="230" font-size="12.5" fill="#60A5FA">test_focus <tspan fill="#1E3FB2" opacity="0.7">..........</tspan></text>
    <text class="sans" x="300" y="230" font-size="14.5" fill="#C8DEFF">Data Analytics · Quality Assurance</text>
