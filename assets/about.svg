  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#2563EB" fill-opacity="0.3"/></pattern>
    <linearGradient id="nameGrad" x1="0" x2="1"><stop offset="0" stop-color="#2875FB"/><stop offset="1" stop-color="#60A5FA"/></linearGradient>
    <clipPath id="panelClip"><rect x="10" y="10" width="1180" height="464" rx="24"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Nunito, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; }
    .pulse { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
    .float { animation: float 5s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    .m-bounce { animation: mbounce 2.4s cubic-bezier(.45,0,.55,1) infinite; }
    @keyframes mbounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    .m-squash { transform-box: fill-box; transform-origin: 50% 100%; animation: msquash 2.4s cubic-bezier(.45,0,.55,1) infinite; }
    @keyframes msquash { 0%,100% { transform: scale(1.06,.94); } 12% { transform: scale(1,1); } 50% { transform: scale(.97,1.03); } 88% { transform: scale(1,1); } }
    .m-shadow { transform-box: fill-box; transform-origin: center; animation: mshadow 2.4s cubic-bezier(.45,0,.55,1) infinite; }
    @keyframes mshadow { 0%,100% { transform: scale(1); opacity: .5; } 50% { transform: scale(.75); opacity: .25; } }
    .m-eye { transform-box: fill-box; transform-origin: center; animation: mblink 4.5s infinite; }
    @keyframes mblink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    .m-wave { transform-box: fill-box; transform-origin: 30% 80%; animation: mwave 3s ease-in-out infinite; }
    @keyframes mwave { 0%,55%,100% { transform: rotate(0deg); } 62% { transform: rotate(-40deg); } 70% { transform: rotate(-15deg); } 78% { transform: rotate(-40deg); } 86% { transform: rotate(0deg); } }

    .line { opacity: 0; animation: line 12s infinite; }
    .l0 { animation-delay: 0.6s; } .l1 { animation-delay: 1.3s; } .l2 { animation-delay: 2.0s; } .l3 { animation-delay: 2.7s; } .l4 { animation-delay: 3.4s; } .l5 { animation-delay: 4.1s; } 
    @keyframes line { 0% { opacity: 0; transform: translateX(-8px); } 3%,85% { opacity: 1; transform: translateX(0); } 90%,100% { opacity: 0; } }
    .sum { opacity: 0; animation: sum 12s infinite; animation-delay: 4.8s; }
    @keyframes sum { 0% { opacity: 0; } 3%,55% { opacity: 1; } 60%,100% { opacity: 0; } }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

  </style>
