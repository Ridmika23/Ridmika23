  <text class="mono" x="600" y="146" font-size="10.5" fill="#3B5498" text-anchor="middle">test_ridmika.py</text>
  <line x1="50" y1="162" x2="1150" y2="162" stroke="#1E3FB2" stroke-width="1" opacity="0.6"/>

  <g class="line l0">
    <circle cx="80" cy="192" r="9" fill="#2875FB"/>
