  <text class="mono" x="1070" y="59" font-size="10.5" fill="#60A5FA">pytest -v</text>

  <!-- Terminal window -->
  <rect x="50" y="120" width="1100" height="324" rx="16" fill="#060B15" stroke="#1E3FB2" stroke-width="1.2"/>
