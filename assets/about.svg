    <text class="mono" x="1092" y="229" font-size="10.5" font-weight="700" fill="#E8F0FF" text-anchor="middle">PASSED</text>
  </g>
  <g class="line l2">
    <circle cx="80" cy="260" r="9" fill="#2875FB"/>
    <path d="M75.5 260 l3 3 l5 -6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="mono" x="100" y="264" font-size="12.5" fill="#60A5FA">test_leadership <tspan fill="#1E3FB2" opacity="0.7">.....</tspan></text>
    <text class="sans" x="300" y="264" font-size="14.5" fill="#C8DEFF">Treasurer — IEEE CS Student Branch Chapter, SLTC (2025–26)</text>
    <rect x="1058" y="248" width="68" height="22" rx="11" fill="#1E3FB2" fill-opacity="0.55"/>
    <text class="mono" x="1092" y="263" font-size="10.5" font-weight="700" fill="#E8F0FF" text-anchor="middle">PASSED</text>
  </g>
  <g class="line l3">
    <circle cx="80" cy="294" r="9" fill="#2875FB"/>
    <path d="M75.5 294 l3 3 l5 -6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="mono" x="100" y="298" font-size="12.5" fill="#60A5FA">test_interests <tspan fill="#1E3FB2" opacity="0.7">......</tspan></text>
    <text class="sans" x="300" y="298" font-size="14.5" fill="#C8DEFF">Explainable AI · Power BI dashboards · Software testing</text>
    <rect x="1058" y="282" width="68" height="22" rx="11" fill="#1E3FB2" fill-opacity="0.55"/>
    <text class="mono" x="1092" y="297" font-size="10.5" font-weight="700" fill="#E8F0FF" text-anchor="middle">PASSED</text>
  </g>
  <g class="line l4">
    <circle cx="80" cy="328" r="9" fill="#2875FB"/>
    <path d="M75.5 328 l3 3 l5 -6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="mono" x="100" y="332" font-size="12.5" fill="#60A5FA">test_seeking <tspan fill="#1E3FB2" opacity="0.7">........</tspan></text>
    <text class="sans" x="300" y="332" font-size="14.5" fill="#C8DEFF">Internship in Data Analytics / QA</text>
    <rect x="1058" y="316" width="68" height="22" rx="11" fill="#1E3FB2" fill-opacity="0.55"/>
    <text class="mono" x="1092" y="331" font-size="10.5" font-weight="700" fill="#E8F0FF" text-anchor="middle">PASSED</text>
  </g>
  <g class="line l5">
    <circle cx="80" cy="362" r="9" fill="#2875FB"/>
    <path d="M75.5 362 l3 3 l5 -6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="mono" x="100" y="366" font-size="12.5" fill="#60A5FA">test_location <tspan fill="#1E3FB2" opacity="0.7">.......</tspan></text>
    <text class="sans" x="300" y="366" font-size="14.5" fill="#C8DEFF">Ratnapura, Sri Lanka</text>
    <rect x="1058" y="350" width="68" height="22" rx="11" fill="#1E3FB2" fill-opacity="0.55"/>
    <text class="mono" x="1092" y="365" font-size="10.5" font-weight="700" fill="#E8F0FF" text-anchor="middle">PASSED</text>
  </g>

  <line x1="70" y1="392" x2="1130" y2="392" stroke="#1E3FB2" stroke-dasharray="4 4" opacity="0.6"/>
  <text class="mono sum" x="70" y="416" font-size="13" fill="#2875FB" font-weight="700">========  6 passed in 0.42s  ========</text>

  <!-- Mascot -->
  <g transform="translate(1096 422) scale(0.6)">
    <ellipse class="m-shadow" cx="0" cy="62" rx="44" ry="7" fill="#1E3FB2" fill-opacity="0.35"/>
    <g class="m-bounce"><g class="m-squash">
      <ellipse cx="-16" cy="56" rx="11" ry="7" fill="#0D1526" stroke="#1E3FB2" stroke-width="2"/>
      <ellipse cx="16" cy="56" rx="11" ry="7" fill="#0D1526" stroke="#1E3FB2" stroke-width="2"/>
      <ellipse cx="-56" cy="14" rx="9" ry="13" fill="#0D1526" stroke="#1E3FB2" stroke-width="2"/>
      <ellipse cx="56" cy="12" rx="9" ry="13" fill="#0D1526" stroke="#1E3FB2" stroke-width="2"/>
      <path d="M-54 50 C-60 -8 -48 -48 0 -48 C48 -48 60 -8 54 50 Q0 60 -54 50 Z" fill="#0D1526" stroke="#1E3FB2" stroke-width="2.2"/>
      <path d="M36 -34 Q58 0 48 46 Q36 54 22 56 Q46 20 36 -34 Z" fill="#2875FB" fill-opacity="0.18"/>
      <circle cx="-30" cy="-30" r="1.4" fill="#2563EB" fill-opacity="0.8"/><circle cx="-18" cy="-40" r="1.4" fill="#2563EB" fill-opacity="0.8"/><circle cx="22" cy="-36" r="1.4" fill="#2563EB" fill-opacity="0.8"/><circle cx="34" cy="-18" r="1.4" fill="#2563EB" fill-opacity="0.8"/>
      <ellipse class="m-eye" cx="-13" cy="-4" rx="4" ry="5" fill="#60A5FA"/>
      <ellipse class="m-eye" cx="13" cy="-4" rx="4" ry="5" fill="#60A5FA"/>
      <circle cx="-11.5" cy="-6" r="1.3" fill="#ffffff"/><circle cx="14.5" cy="-6" r="1.3" fill="#ffffff"/>
      <ellipse cx="-25" cy="8" rx="7" ry="4" fill="#ff9fb4" fill-opacity="0.5"/>
      <ellipse cx="25" cy="8" rx="7" ry="4" fill="#ff9fb4" fill-opacity="0.5"/>
      <path d="M-7 7 Q0 14 7 7" fill="none" stroke="#E8F0FF" stroke-width="2.2" stroke-linecap="round"/>
    </g></g>
